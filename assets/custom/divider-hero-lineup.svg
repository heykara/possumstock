<svg viewBox="0 0 1440 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <!-- Jagged hand-drawn ink wave -->
    <path d="M0,55 C60,30 120,70 200,50 C280,30 320,65 400,48 C480,30 530,68 620,50 C710,32 760,62 860,48 C960,34 1010,66 1100,50 C1190,34 1260,62 1360,48 C1400,42 1430,50 1440,50 L1440,90 L0,90 Z"
      fill="rgba(255,255,255,0.3)" stroke="#1a1228" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Decorative doodles sitting on the wave -->
    <!-- Mushroom left -->
    <g transform="translate(88,14)">
      <rect x="-6" y="18" width="12" height="18" rx="2" fill="#f5f0e8" stroke="#1a1228" stroke-width="2"/>
      <ellipse cx="0" cy="18" rx="18" ry="12" fill="#8ee820" stroke="#1a1228" stroke-width="2.5"/>
      <circle cx="-6" cy="12" r="3.5" fill="#fff" stroke="#1a1228" stroke-width="1.5"/>
      <circle cx="5" cy="8" r="4" fill="#fff" stroke="#1a1228" stroke-width="1.5"/>
    </g>
    <!-- Star center-left -->
    <g transform="translate(360,22)">
      <path d="M0,-14 L3,-5 L13,-5 L5,1 L8,11 L0,5 L-8,11 L-5,1 L-13,-5 L-3,-5 Z" fill="#f8d800" stroke="#1a1228" stroke-width="2"/>
    </g>
    <!-- Worm squiggle center -->
    <g transform="translate(700,30)">
      <path d="M-40,0 C-28,-14 -14,14 0,0 C14,-14 28,14 40,0" fill="none" stroke="#f07898" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-40" cy="0" r="6" fill="#f07898" stroke="#1a1228" stroke-width="2"/>
      <circle cx="-43" cy="-2" r="2" fill="#1a1228"/>
    </g>
    <!-- Music note right-center -->
    <g transform="translate(1020,18)">
      <path d="M6,-16 L6,8" stroke="#1a1228" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="2" cy="10" rx="7" ry="5" fill="#9858c8" stroke="#1a1228" stroke-width="2" transform="rotate(-20 2 10)"/>
    </g>
    <!-- Mushroom right — cyan cap -->
    <g transform="translate(1320,16)">
      <rect x="-6" y="18" width="12" height="16" rx="2" fill="#f5f0e8" stroke="#1a1228" stroke-width="2"/>
      <ellipse cx="0" cy="18" rx="16" ry="11" fill="#00c8e8" stroke="#1a1228" stroke-width="2.5"/>
      <circle cx="-4" cy="12" r="3" fill="#fff" stroke="#1a1228" stroke-width="1.5"/>
      <circle cx="6" cy="9" r="3.5" fill="#fff" stroke="#1a1228" stroke-width="1.5"/>
    </g>
    <!-- Spiral doodle -->
    <g transform="translate(530,24)">
      <path d="M0,0 C0,-8 8,-10 8,-4 C8,4 0,6 0,0" fill="none" stroke="#f07820" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Paw print -->
    <g transform="translate(1160,28)">
      <ellipse cx="0" cy="4" rx="5" ry="4" fill="#c8c0b8" stroke="#1a1228" stroke-width="1.8"/>
      <ellipse cx="-6" cy="-2" rx="2.5" ry="3" fill="#c8c0b8" stroke="#1a1228" stroke-width="1.5"/>
      <ellipse cx="0" cy="-5" rx="2.5" ry="3" fill="#c8c0b8" stroke="#1a1228" stroke-width="1.5"/>
      <ellipse cx="6" cy="-2" rx="2.5" ry="3" fill="#c8c0b8" stroke="#1a1228" stroke-width="1.5"/>
    </g>
  </svg>
