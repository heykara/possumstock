      <path d="M22 50 C28 56,40 56,44 51" fill="#c02838" stroke="#1a1228" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 50 L24 54 M29 49 L29 54 M34 49 L34 54 M39 49 L39 53" stroke="#fffacd" stroke-width="2.5" stroke-linecap="round"/>
      <!-- fur -->
