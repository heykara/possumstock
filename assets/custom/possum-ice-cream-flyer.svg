<svg xmlns="http://www.w3.org/2000/svg" width="72" height="80" viewBox="0 0 72 80" fill="none">
      <!-- body -->
      <ellipse cx="36" cy="52" rx="22" ry="20" fill="#b8b0a8" stroke="#1a1228" stroke-width="2.5"/>
      <!-- belly -->
      <ellipse cx="36" cy="56" rx="13" ry="14" fill="#dedad4" stroke="none"/>
      <!-- tail -->
      <path d="M56 60 C70 52,76 66,70 74 C64 80,56 72,60 64" fill="none" stroke="#f0b8c8" stroke-width="5" stroke-linecap="round"/>
      <!-- tail scale lines -->
      <path d="M58 61 L62 64 M64 59 L67 63 M69 62 L70 67" stroke="#1a1228" stroke-width="1" stroke-linecap="round" opacity=".5"/>
      <!-- ears -->
      <circle cx="20" cy="24" r="11" fill="#b8b0a8" stroke="#1a1228" stroke-width="2.2"/>
      <circle cx="20" cy="24" r="6.5" fill="#f0b8c8" stroke="#1a1228" stroke-width="1.2"/>
      <circle cx="50" cy="22" r="10" fill="#b8b0a8" stroke="#1a1228" stroke-width="2.2"/>
      <circle cx="50" cy="22" r="6" fill="#f0b8c8" stroke="#1a1228" stroke-width="1.2"/>
      <!-- head -->
      <ellipse cx="34" cy="34" rx="20" ry="18" fill="#c8c0b8" stroke="#1a1228" stroke-width="2.5"/>
      <!-- snout -->
      <ellipse cx="26" cy="40" rx="10" ry="7" fill="#d4ccc4" stroke="#1a1228" stroke-width="2"/>
      <ellipse cx="22" cy="42" rx="3.5" ry="2.5" fill="#f08898" stroke="#1a1228" stroke-width="1.2"/>
      <!-- googly eyes -->
      <circle cx="32" cy="30" r="7" fill="#fff" stroke="#1a1228" stroke-width="2.2"/>
      <circle cx="46" cy="29" r="6.5" fill="#fff" stroke="#1a1228" stroke-width="2.2"/>
      <circle cx="33" cy="31" r="3.8" fill="#1a1228"/>
      <circle cx="47" cy="30" r="3.5" fill="#1a1228"/>
      <circle cx="31" cy="29" r="1.4" fill="#fff"/>
      <circle cx="45" cy="28" r="1.3" fill="#fff"/>
      <!-- open mouth -->
      <path d="M22 46 C26 51,36 51,40 47" fill="#c83040" stroke="#1a1228" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 46 L24 50 M28 45 L28 50 M32 45 L32 50 M36 45 L36 49" stroke="#fffacd" stroke-width="2.5" stroke-linecap="round"/>
      <!-- whiskers -->
      <line x1="16" y1="40" x2="2"  y2="36" stroke="#1a1228" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="16" y1="42" x2="0"  y2="42" stroke="#1a1228" stroke-width="1.3" stroke-linecap="round"/>
      <!-- spiky head fur -->
      <path d="M18 24 L14 14 L22 22 L22 12 L28 20 L32 10 L36 20 L42 12 L44 22 L50 16 L50 26" fill="#555048" stroke="#1a1228" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- arm holding ice cream -->
      <path d="M44 48 C50 44,54 40,52 34" stroke="#b8b0a8" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M44 48 C50 44,54 40,52 34" stroke="#c8c0b8" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- ice cream cone -->
      <path d="M46 34 L52 20 L58 34 Z" fill="#e8b860" stroke="#1a1228" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M47 34 L49 28 M52 34 L51 27 M57 34 L55 28" stroke="#c89040" stroke-width="1" opacity=".5"/>
      <circle cx="52" cy="20" r="8" fill="#f07898" stroke="#1a1228" stroke-width="1.8"/>
      <circle cx="52" cy="17" r="3" fill="#f8c0c8" opacity=".6"/>
      <!-- pink paw -->
      <ellipse cx="54" cy="36" rx="5" ry="4" fill="#f0b8c8" stroke="#1a1228" stroke-width="1.5" transform="rotate(20 54 36)"/>
      <path d="M51 32 L49 29 M54 31 L53 28 M58 33 L57 30" stroke="#1a1228" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
