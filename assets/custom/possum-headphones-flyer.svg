<svg xmlns="http://www.w3.org/2000/svg" width="74" height="82" viewBox="0 0 74 82" fill="none">
      <!-- body -->
      <ellipse cx="38" cy="58" rx="23" ry="20" fill="#b0a8a0" stroke="#1a1228" stroke-width="2.5"/>
      <ellipse cx="38" cy="62" rx="14" ry="14" fill="#d8d4ce"/>
      <!-- tail -->
      <path d="M14 64 C-2 56,-8 72,-2 80" fill="none" stroke="#f0b8c8" stroke-width="5" stroke-linecap="round"/>
      <path d="M18 62 L12 66 M12 58 L8 63" stroke="#1a1228" stroke-width="1" stroke-linecap="round" opacity=".4"/>
      <!-- ears -->
      <circle cx="20" cy="24" r="12" fill="#b0a8a0" stroke="#1a1228" stroke-width="2.2"/>
      <circle cx="20" cy="24" r="7" fill="#f0b8c8" stroke="#1a1228" stroke-width="1.2"/>
      <circle cx="54" cy="22" r="11" fill="#b0a8a0" stroke="#1a1228" stroke-width="2.2"/>
      <circle cx="54" cy="22" r="6.5" fill="#f0b8c8" stroke="#1a1228" stroke-width="1.2"/>
      <!-- head -->
      <ellipse cx="36" cy="36" rx="22" ry="20" fill="#c0b8b0" stroke="#1a1228" stroke-width="2.5"/>
      <!-- snout pointing left (facing right page edge) -->
      <ellipse cx="46" cy="43" rx="10" ry="7" fill="#ccc4bc" stroke="#1a1228" stroke-width="2"/>
      <ellipse cx="50" cy="45" rx="3.5" ry="2.5" fill="#f08898" stroke="#1a1228" stroke-width="1.2"/>
      <!-- eyes -->
      <circle cx="26" cy="32" r="8" fill="#fff" stroke="#1a1228" stroke-width="2.5"/>
      <circle cx="42" cy="31" r="7.5" fill="#fff" stroke="#1a1228" stroke-width="2.5"/>
      <circle cx="27" cy="33" r="4.5" fill="#1a1228"/>
      <circle cx="43" cy="32" r="4" fill="#1a1228"/>
      <circle cx="25" cy="31" r="1.6" fill="#fff"/>
      <circle cx="41" cy="30" r="1.5" fill="#fff"/>
      <!-- open mouth -->
      <path d="M30 49 C36 55,48 55,52 50" fill="#c02838" stroke="#1a1228" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 49 L32 53 M37 48 L37 53 M42 48 L42 53 M47 49 L47 53" stroke="#fffacd" stroke-width="2.5" stroke-linecap="round"/>
      <!-- fur -->
      <path d="M18 24 L14 12 L22 22 L22 10 L28 20 L34 8 L38 20 L46 10 L50 22 L58 14 L56 26" fill="#484038" stroke="#1a1228" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- whiskers -->
      <line x1="56" y1="42" x2="72" y2="37" stroke="#1a1228" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="56" y1="44" x2="74" y2="44" stroke="#1a1228" stroke-width="1.3" stroke-linecap="round"/>
      <!-- headphones (cyan/blue) -->
      <path d="M17 32 C16 8,60 6,60 30" fill="none" stroke="#1890e8" stroke-width="5" stroke-linecap="round"/>
      <rect x="10" y="28" width="13" height="18" rx="5" fill="#0090c8" stroke="#1a1228" stroke-width="2"/>
      <rect x="53" y="26" width="13" height="18" rx="5" fill="#0090c8" stroke="#1a1228" stroke-width="2"/>
      <!-- music notes -->
      <text x="28" y="78" font-size="13" fill="#1a1228" opacity=".55" font-family="serif">♪ ♫</text>
    </svg>
