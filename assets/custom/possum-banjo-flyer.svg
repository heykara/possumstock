<svg xmlns="http://www.w3.org/2000/svg" width="78" height="88" viewBox="0 0 78 88" fill="none">
      <!-- body -->
      <ellipse cx="36" cy="58" rx="24" ry="22" fill="#a8a09a" stroke="#1a1228" stroke-width="2.5"/>
      <ellipse cx="36" cy="62" rx="14" ry="16" fill="#d4d0ca"/>
      <!-- tail -->
      <path d="M12 66 C-4 58,-10 76,-2 84" fill="none" stroke="#f0b8c8" stroke-width="5" stroke-linecap="round"/>
      <!-- hat brim (blue cap like flyer) -->
      <path d="M16 36 Q18 24,38 22 Q58 24,60 36" fill="#4488cc" stroke="#1a1228" stroke-width="2.2"/>
      <rect x="12" y="34" width="52" height="5" rx="2" fill="#4488cc" stroke="#1a1228" stroke-width="1.8"/>
      <!-- ears -->
      <circle cx="20" cy="28" r="11" fill="#a8a09a" stroke="#1a1228" stroke-width="2.2"/>
      <circle cx="20" cy="28" r="6.5" fill="#f0b8c8"/>
      <circle cx="54" cy="26" r="11" fill="#a8a09a" stroke="#1a1228" stroke-width="2.2"/>
      <circle cx="54" cy="26" r="6.5" fill="#f0b8c8"/>
      <!-- head -->
      <ellipse cx="36" cy="40" rx="22" ry="20" fill="#bcb4ac" stroke="#1a1228" stroke-width="2.5"/>
      <!-- snout -->
      <ellipse cx="46" cy="47" rx="10" ry="7" fill="#ccc4bc" stroke="#1a1228" stroke-width="2"/>
      <ellipse cx="50" cy="49" rx="3.5" ry="2.5" fill="#f08898" stroke="#1a1228" stroke-width="1.2"/>
      <!-- eyes -->
      <circle cx="26" cy="36" r="7.5" fill="#fff" stroke="#1a1228" stroke-width="2.5"/>
      <circle cx="42" cy="35" r="7" fill="#fff" stroke="#1a1228" stroke-width="2.5"/>
      <circle cx="27" cy="37" r="4.2" fill="#1a1228"/>
      <circle cx="43" cy="36" r="3.8" fill="#1a1228"/>
      <circle cx="25" cy="35" r="1.5" fill="#fff"/>
      <circle cx="41" cy="34" r="1.4" fill="#fff"/>
      <!-- mouth -->
      <path d="M30 53 C36 59,48 59,52 54" fill="#c02838" stroke="#1a1228" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 53 L32 57 M37 52 L37 57 M43 52 L43 57 M48 53 L48 57" stroke="#fffacd" stroke-width="2.5" stroke-linecap="round"/>
      <!-- fur -->
      <path d="M18 28 L14 16 L22 26 L22 14 L28 24 L34 12 L38 24 L46 14 L50 26 L58 18 L56 28" fill="#484038" stroke="#1a1228" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- arm holding banjo -->
      <path d="M50 58 C58 52,64 44,60 36" stroke="#a8a09a" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M50 58 C58 52,64 44,60 36" stroke="#bcb4ac" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- banjo body -->
      <circle cx="56" cy="30" r="14" fill="#e8b820" stroke="#1a1228" stroke-width="2.5"/>
      <circle cx="56" cy="30" r="9" fill="none" stroke="#1a1228" stroke-width="1.5"/>
      <circle cx="56" cy="30" r="2.5" fill="#1a1228"/>
      <!-- banjo neck -->
      <rect x="66" y="10" width="7" height="28" rx="3" fill="#c89050" stroke="#1a1228" stroke-width="2" transform="rotate(20 69 24)"/>
      <!-- strings -->
      <path d="M64 16 L70 42 M67 15 L73 41" stroke="#1a1228" stroke-width="0.8" opacity=".5"/>
      <!-- paw -->
      <ellipse cx="62" cy="38" rx="5" ry="4" fill="#f0b8c8" stroke="#1a1228" stroke-width="1.5" transform="rotate(10 62 38)"/>
      <path d="M59 34 L57 31 M63 33 L62 30 M67 35 L67 32" stroke="#1a1228" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
